<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>AdRelay · 账号</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9; --card: #fff; --ink: #1c2230; --muted: #596174;
      --line: #dce0e7; --well: #f3f5f8; --field: #fcfcfd; --accent: #bd251c;
      --accent-hover: #a91f17; --selected: #fdf0ed; --selected-border: #f1c6c0;
      --alert: #a12620; --glow: #f7e6e4; --shadow: #262b3710;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #10151e; --card: #1a2330; --ink: #eef3fa; --muted: #c5d0df;
      --line: #354255; --well: #141d29; --field: #171f2c; --accent: #a93028;
      --accent-hover: #bd4036; --selected: #372631; --selected-border: #73454a;
      --alert: #ff9d9c; --glow: #2a202b; --shadow: #0004;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: radial-gradient(ellipse at 50% 0%, var(--glow), transparent 58%), var(--bg);
      color: var(--ink); font: 15px/1.55 system-ui, sans-serif;
    }
    .account-layout {
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      padding: clamp(12px, 5vw, 36px);
    }
    main {
      width: min(100%, 28rem); min-width: 0; margin: auto; padding: clamp(18px, 5vw, 30px);
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      box-shadow: 0 16px 48px var(--shadow), 0 3px 8px var(--shadow);
    }
    main:has(#members:not([hidden])) { width: min(100%, 43rem); }
    .account-header { display: grid; position: relative; justify-items: center; padding-top: 33px; }
    .language-control { position: absolute; top: 0; right: 0; }
    .language-control select { min-height: 34px; padding: 4px 8px; background: var(--field); font-size: 13px; }
    .account-brand {
      position: relative; width: min(100%, 176px); aspect-ratio: 3.12;
      margin: 0 0 7px; overflow: hidden; isolation: isolate;
    }
    .account-brand .brand {
      position: absolute; left: 50%; top: 50%; width: 116%; height: auto;
      display: block; transform: translate(-50%, -50%);
    }
    html[data-theme="dark"] .account-brand .brand {
      filter: grayscale(1) invert(1) sepia(1) saturate(5) hue-rotate(325deg) brightness(1.45);
      mix-blend-mode: screen;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    h2, p { margin: 0 0 10px; }
    h2 { font-size: 18px; }
    label { display: grid; gap: 5px; font-size: 14px; font-weight: 600; min-width: 0; }
    input, button, select {
      min-height: 42px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--card); color: var(--ink); font: inherit;
    }
    input { width: 100%; min-height: 44px; background: var(--field); }
    input[aria-invalid="true"] { border-color: var(--alert); }
    button { cursor: pointer; }
    button:hover:not(:disabled) { background: var(--well); }
    button:disabled { opacity: .55; cursor: default; }
    button:focus-visible, input:focus-visible, select:focus-visible, .actions a:focus-visible {
      outline: 2px solid var(--alert); outline-offset: 2px;
    }
    .actions, .member, .approval { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .actions a { display: inline-flex; align-items: center; min-height: 42px; padding: 7px 12px; border-radius: 9px; text-decoration: none; }
    .actions a.primary, button.primary { background: var(--accent); color: #fff; font-weight: 650; border-color: var(--accent); }
    .actions a.primary:hover, button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
    #auth-nav {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;
      margin: 15px 0 18px; padding: 4px; border: 1px solid var(--line); border-radius: 11px; background: var(--well);
    }
    #auth-nav button { min-height: 36px; padding: 5px 2px; border: 1px solid transparent; background: transparent; font-size: 13px; }
    #auth-nav button[aria-pressed="true"] { color: var(--alert); border-color: var(--selected-border); background: var(--selected); font-weight: 650; }
    form { display: grid; gap: 13px; }
    #auth-submit { min-height: 44px; margin-top: 3px; }
    #profile { margin-top: 18px; }
    #identity { color: var(--muted); overflow-wrap: anywhere; }
    #membership-status:empty, #message:empty { display: none; }
    #members { margin-top: 23px; }
    #message { margin: 14px 0 0; color: var(--muted); overflow-wrap: anywhere; }
    #message[data-error] { color: var(--alert); }
    .team-entry { margin: 18px 0 0; padding-top: 12px; border-top: 1px solid var(--line); text-align: center; }
    .team-entry a { color: var(--muted); font-size: 13px; text-underline-offset: 3px; }
    .member { justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); }
    .member div:first-child { min-width: 0; }
    .member small { display: block; color: var(--muted); overflow-wrap: anywhere; }
    .approval input { width: 8rem; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="./account.js?v=6" defer></script>
