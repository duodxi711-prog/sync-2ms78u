<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>AdRelay · 每日填报</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9; --card: #fff; --ink: #1c2230; --muted: #596174;
      --line: #dce0e7; --well: #f3f5f8; --field: #fcfcfd; --accent: #bd251c;
      --accent-hover: #a91f17; --selected: #fdf0ed; --selected-border: #f1c6c0;
      --alert: #a12620; --glow: #f7e6e4; --shadow: #262b3710;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #10151e; --card: #1a2330; --ink: #eef3fa; --muted: #c5d0df;
      --line: #354255; --well: #141d29; --field: #171f2c; --accent: #a93028;
      --accent-hover: #bd4036; --selected: #372631; --selected-border: #73454a;
      --alert: #ff9d9c; --glow: #2a202b; --shadow: #0004;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, sans-serif; }
    .report-header { background: var(--card); border-bottom: 1px solid var(--line); }
    .report-header-inner, main { width: min(100%, 68rem); margin-inline: auto; padding-inline: clamp(14px, 3vw, 30px); }
    .report-header-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; }
    .report-brand { position: relative; display: block; width: 125px; aspect-ratio: 3.12; overflow: hidden; isolation: isolate; }
    .report-brand img { position: absolute; left: 50%; top: 50%; width: 116%; height: auto; transform: translate(-50%, -50%); }
    html[data-theme="dark"] .report-brand img { filter: grayscale(1) invert(1) sepia(1) saturate(5) hue-rotate(325deg) brightness(1.45); mix-blend-mode: screen; }
    .report-nav, .actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px 16px; }
    .report-nav a { color: var(--muted); text-decoration: none; font-size: 14px; }
    .report-nav a:hover { text-decoration: underline; }
    .actions { justify-content: start; margin-top: 10px; }
    main { padding-block: 25px 42px; }
    h1 { margin: 0 0 18px; font-size: 25px; }
    h2 { margin: 0 0 10px; font-size: 17px; }
    p { margin: 0 0 12px; }
    .report-notice, .daily-content > section { border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: clamp(13px, 3vw, 20px); }
    .report-notice a { color: var(--alert); }
    .daily-content { display: grid; gap: 14px; }
    form { display: grid; gap: 13px; }
    label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
    #daily-member-filter { max-width: 270px; }
    input, button, select { min-height: 42px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); color: var(--ink); font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    button.primary { background: var(--accent); color: #fff; font-weight: 650; border-color: var(--accent); }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    :focus-visible { outline: 2px solid var(--alert); outline-offset: 2px; }
    .daily-fields, .daily-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 135px), 1fr)); gap: 12px; align-items: end; }
    .daily-content input, .daily-content select { width: 100%; min-width: 0; }
    .daily-content p[role="status"] { margin: 8px 0 0; color: var(--muted); }
    .daily-content p[data-error] { color: var(--alert); }
    .daily-table { overflow-x: auto; margin: 10px 0 0; }
    .daily-table table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    .daily-table th, .daily-table td { border-bottom: 1px solid var(--line); padding: 8px; text-align: left; white-space: nowrap; }
    .daily-table th { background: var(--well); font-weight: 650; }
    .daily-table button { min-height: 32px; }
    .daily-note { color: var(--muted); font-size: 13px; }
    .daily-content button.primary { justify-self: start; }
  </style>

  <main>
    <h1 id="reporting-title">每日填报</h1>
    <section class="report-notice" id="reporting-access">
      <p id="reporting-access-status" role="status">正在验证账号…</p>
      <a id="reporting-signin" href="./account.html?view=daily" hidden>前往账号页</a>
    </section>
      <section id="daily-reports" aria-labelledby="reporting-title" hidden>
        <div class="daily-content">
          <section aria-labelledby="daily-write-title">
            <h2 id="daily-write-title" data-daily-text="write">填写投放数据</h2>
            <p class="daily-note" data-daily-text="saveHint">同一天、同一个 Offer 和平台只记一笔。再次保存会更新这笔数据。</p>
            <form id="daily-form">
              <div class="daily-fields">
                <label><span data-daily-text="date">日期</span><input type="date" name="date" required></label>
                <label><span>Offer</span><input name="offer" list="daily-offers" maxlength="80" required></label>
                <datalist id="daily-offers">
                  <option value="GlucoBase"></option><option value="YoBurn"></option><option value="AlkaMelt"></option>
                  <option value="VisiVra"></option><option value="LungVicks"></option><option value="VapoBrain"></option>
                  <option value="NeuroTamine"></option><option value="SlimZol"></option>
                </datalist>
                <label><span data-daily-text="platform">平台</span><select name="platform"><option value="facebook">Facebook</option><option value="newsbreak">NewsBreak</option></select></label>
                <label><span data-daily-text="spend">花费（USD）</span><input name="spend" type="number" min="0" max="9999999999.99" step="0.01" required></label>
                <label><span data-daily-text="cpcInput">CPC（可选）</span><input name="cpc" type="number" min="0" max="99999999.9999" step="0.0001"></label>
                <label><span data-daily-text="orders">出单</span><input name="purchases" type="number" min="0" max="2147483647" step="1" required></label>
                <label><span data-daily-text="revenue">营收（USD）</span><input name="revenue" type="number" min="0" max="9999999999.99" step="0.01" required></label>
              </div>
              <button class="primary" type="submit" data-daily-text="save">保存日报</button>
            </form>
            <p id="daily-save-status" role="status"></p>
          </section>
          <section aria-labelledby="daily-totals-title">
            <h2 id="daily-totals-title" data-daily-text="totals">团队填报汇总</h2>
            <p class="daily-note" data-daily-text="scope">此处汇总通过日报表单录入的数据。历史报表仍在「测试结果」页。</p>
            <form id="daily-filter" class="daily-filters">
              <label><span data-daily-text="from">开始日期</span><input type="date" name="from" required></label>
              <label><span data-daily-text="to">结束日期</span><input type="date" name="to" required></label>
              <label><span>Offer</span><input name="offer" list="daily-offers" maxlength="80"></label>
              <button type="submit" data-daily-text="apply">查询</button>
            </form>
            <div class="daily-table"><table aria-labelledby="daily-totals-title" id="daily-totals"></table></div>
          </section>
          <section aria-labelledby="daily-details-title">
            <h2 id="daily-details-title" data-daily-text="mine">我的日报</h2>
            <label id="daily-member-filter" hidden>
              <span data-daily-text="member">员工</span>
              <select id="daily-member"></select>
            </label>
            <div class="daily-table"><table aria-labelledby="daily-details-title" id="daily-details"></table></div>
            <div class="actions" id="daily-pagination" hidden>
              <button type="button" id="daily-prev" data-daily-text="previous">上一页</button>
              <button type="button" id="daily-next" data-daily-text="next">下一页</button>
            </div>
            <p id="daily-list-status" role="status"></p>
          </section>
        </div>
      </section>
  </main>
</body>
